# =============================================================================
# Internal Developer Portal — security headers
# =============================================================================
# Mounted read-only at /etc/nginx/conf.d/security-headers.conf by compose and
# included once, at server level, in docker/nginx/default.conf.
#
# Rules that cost someone an afternoon, written down:
#   * Any `add_header` inside a `location` block REPLACES every inherited header.
#     That is why default.conf adds no headers in its locations — the cache
#     locations would silently drop the CSP.
#   * MkDocs Material ships one inline <script> for the light/dark palette
#     toggle and inline styles for its palette, so 'unsafe-inline' is required
#     for script-src and style-src. Everything else stays 'self'.
#   * HSTS is intentionally absent: the portal serves plain HTTP behind a proxy.
#     Enable it at the TLS terminator only, or browsers will pin a scheme this
#     container cannot serve.

add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "DENY" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy  "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
