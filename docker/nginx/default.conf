# =============================================================================
# Internal Developer Portal — Nginx server block
# =============================================================================
# Runs as uid 101 (nginx-unprivileged) and therefore listens on 8080, never 80.
# Only static files are served: no CGI, no proxy_pass, no directory listing, no
# .git access. Security headers come from configs/nginx/security-headers.conf,
# which compose mounts read-only.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Baseline ------------------------------------------------------------
    charset                utf-8;
    server_tokens          off;
    absolute_redirect      off;
    client_max_body_size   1m;
    client_body_timeout    10s;
    keepalive_timeout      30s;

    include /etc/nginx/conf.d/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Health --------------------------------------------------------------
    # Deliberately outside the security headers: a monitor wants a cheap 200,
    # not a full HTML response.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Static content ------------------------------------------------------
    # MkDocs uses directory URLs (/runbooks/oncall/ -> /runbooks/oncall/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Immutable hashed assets can be cached hard. No add_header here on purpose:
    # any add_header in a location replaces the inherited security headers.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # search_index.json and sitemap.xml change with every build.
    location ~* (?:search_index\.json|sitemap\.xml|\.xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Never serve dotfiles, editor backups or the sources behind the site.
    location ~ /\. {
        deny all;
    }
    location ~* (?:\.md|\.yml|\.yaml|~|\.bak|\.orig)$ {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
